<div class="w-full  mx-auto overflow-hidden shadow-2xl /50 bg-opacity-10 bg-[var(--color-card)]  ">
  <swiper-container class="mySwiper md:block md:w-full my-6" direction="horizontal" css-mode="false" loop="false"
    navigation="true" pagination="true" slides-per-view="1" space-between="16" observe-parents="true"
    observe-slide-children="true" update-on-window-resize="true" autoplay="true" style="width:100%; height:60%">
    <ng-container *ngFor="let p of projects">
      <swiper-slide class="!w-full min-w-0">
        <article class="md:w-full min-w-0 rounded-xl p-6 overflow-hidden  ">
          <img [src]="p.img" [alt]="p.title" class="md:contain-content md:p-auto md:m-auto object-cover" style="height:260px"
            loading="lazy" decoding="async" />
          <div class="p-5 min-w-0">
            <p class="text-[var(--color-text)] font-bold text-xl  break-words">{{ p.title }}</p>
            <p class="text-sm  text-muted opacity-90 text-[var(--color-text)] space-pre-line break-words">
              {{ p.desc }}
            </p>
          </div>
          <div class="w-full flex md:flex-row flex-col space-y-1 md:justify-center md:items-center gap-2 ">
            <ng-container *ngIf="isNonEmptyUrl(p.codeUrl) as codeUrl">
              <app-button text="Voir le code sur GitHub" type="primary" icon="code" (actionHandler)="openUrl(p.codeUrl)">
              </app-button>
            </ng-container>

            <ng-container *ngIf="isNonEmptyUrl(p.demoUrl) as demoUrl">
              <app-button text="Voir démo live" type="[var(--color-secondary)]" icon="send" (actionHandler)="openUrl(p.demoUrl)">
              </app-button>
            </ng-container>
          </div>


        </article>
      </swiper-slide>
    </ng-container>
  </swiper-container>
</div>
