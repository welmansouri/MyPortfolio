<div class=" min-w-full max-w-full">


<p class="text-[var(--color-text)] pt-10 font-medium ">


  Vous préférez échanger de vive voix ? Réservez un créneau dans mon agenda pour une discussion en visio.
</p>

  <app-spacer size="sm"></app-spacer>
<div class="md:grid h-full space-y-6 flex-row  w-full md:grid-cols-2 md:gap-6 md:place-content-stretch">
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6 h-max-3/5">

    <div class="md:flex md:flex-row gap-10">
      <div class="md:w-1/2 ">
        <input type="text" formControlName="fullName" placeholder="Votre nom complet"
          class="block w-full placeholder:uppercase rounded-xl  bg-[var(--color-card)] p-3  text-[var(--color-text)] shadow-sm focus:border-[#230E91] focus:ring-[#230E91] placeholder:text-[var(--color-muted)]" />
        <p *ngIf="contactForm.get('fullName')?.hasError('required') && contactForm.get('fullName')?.touched"
          class="text-red-500 text-sm mt-1">
          Champ obligatoire
        </p>
      </div>

      <div class="md:w-1/2 mt-6  md:mt-0">
        <input type="email" formControlName="email" placeholder="email@example.com"
          class="block w-full placeholder:uppercase placeholder:text-[var(--color-muted)] rounded-xl   bg-[var(--color-card)] p-3  text-[var(--color-text)]  shadow-sm focus:border-blue-500 focus:ring-blue-500" />
        <p *ngIf="contactForm.get('email')?.hasError('required') && contactForm.get('email')?.touched"
          class="text-red-500 text-sm mt-1">
          Champ obligatoire
        </p>
        <p *ngIf="contactForm.get('email')?.hasError('email') && contactForm.get('email')?.touched"
          class="text-red-500 text-sm mt-1 ">
          Veuillez entrer une adresse e-mail valide.
        </p>
      </div>
    </div>

    <div>
      <textarea rows="24" formControlName="message" placeholder="Expliquez votre besoin, une idée de collaboration, etc..."
        class="block w-full rounded-xl  placeholder:uppercase placeholder:text-[var(--color-muted)] h-max-full bg-[var(--color-card)] p-3 text-[var(--color-text)] shadow-sm focus:border-[#230E91] focus:ring-[#230E91]" ></textarea>

    </div>

    <div>
        <app-button text="Envoyer" icon="send" type="primary" (actionHandler)="sendEmail()"></app-button>

  
    </div>
  </form>
  <div class="calendar-placeholder"></div>
</div> 

 

</div>
